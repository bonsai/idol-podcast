version: 1
namespace: https://github.com/bonsai/idol-podcast/ontology#

purpose: >-
  idol ecosystem における topology、workflow、repository-to-repository (R2R)、
  intent/architecture workflow (AW) の責務を分離し、相互変換可能な共通語彙を定義する。

layers:
  topology:
    question: "何が存在し、何と接続できるか"
    nature: static-structural
    owns:
      - nodes
      - ports
      - capabilities
      - dependencies
      - allowed_edges
    does_not_own:
      - execution_order
      - runtime_state
      - editorial_approval
    artifact: topology.yaml

  workflow:
    question: "いつ、どの順序で、どの条件で実行するか"
    nature: executable-process
    owns:
      - stages
      - transitions
      - triggers
      - retries
      - runtime_state
      - gates
    does_not_own:
      - repository_ownership
      - business_intent
      - raw_data_schema
    artifact: workflow.yaml

  r2r:
    question: "どのrepoが、どのartifactを、どの契約で受け渡すか"
    nature: inter-repository-contract
    owns:
      - producer
      - consumer
      - artifact_contract
      - provenance
      - compatibility
      - security_boundary
    does_not_own:
      - internal_step_order
      - editorial_argument
      - infrastructure_topology
    artifact: r2r.yaml

  aw:
    question: "なぜ作るか、何を達成するか、意図をどう実装可能な作業へ分解するか"
    nature: intent-to-delivery-decomposition
    owns:
      - intent
      - outcomes
      - actors
      - user_stories
      - acceptance_criteria
      - tasks
      - decision_records
    does_not_own:
      - canonical_data_storage
      - runtime_execution
      - audio_generation_details
    artifact: aw.yaml

  project_data:
    question: "各プロジェクトは何型を何型へ変換する仕事を持つか"
    nature: typed-dataflow
    owns:
      - projects
      - data_types
      - input_types
      - output_types
      - type_transformations
      - validation_contracts
    does_not_own:
      - global_execution_order
      - repository_discovery
      - editorial_approval_policy
    artifact: project.yaml

classes:
  Repository:
    description: source or delivery boundary that owns code, data, or artifacts
  Node:
    description: topology participant such as repository, service, human, or external source
  Port:
    description: named input/output capability exposed by a node
  Artifact:
    description: versioned data, analysis, script, audio, or manifest
  Capability:
    description: operation a node can perform
  Topology:
    description: static graph of nodes, ports, capabilities, and allowed connections
  Workflow:
    description: executable graph of stages and state transitions
  WorkflowStep:
    description: one executable unit inside a workflow
  Gate:
    description: condition that must be satisfied before transition
  R2RContract:
    description: producer-consumer contract spanning repository boundaries
  Provenance:
    description: source, access, retrieval, license, and transformation metadata
  Intent:
    description: desired value or problem statement
  AWPlan:
    description: decomposition from intent to outcomes, stories, criteria, and tasks
  Observation:
    description: recorded fact with provenance and observation time
  Analysis:
    description: comparison, inference, hypothesis, or evaluation over observations
  EditorialText:
    description: human-reviewable critique brief, script, or show notes
  AudioEpisode:
    description: generated audio derived from an approved editorial text
  Project:
    description: unit of ownership responsible for one or more type transformations
  DataType:
    description: versioned shape and media contract flowing between projects
  TypeTransformation:
    description: named work that converts input data types into output data types
  Agent:
    description: actor that performs a project transformation
  Skill:
    description: reusable method or competence used by an agent
  Tool:
    description: executable capability invoked by a workflow task
  Plan:
    description: producer-authored intended sequence of outcomes and milestones
  Task:
    description: executable unit derived from a plan and bound to skill and tool

relations:
  - subject: Repository
    predicate: exposes
    object: Port
  - subject: Port
    predicate: supports
    object: Capability
  - subject: Topology
    predicate: contains
    object: Node
  - subject: Topology
    predicate: allows
    object: Port
  - subject: Workflow
    predicate: executes
    object: WorkflowStep
  - subject: WorkflowStep
    predicate: consumes
    object: Artifact
  - subject: WorkflowStep
    predicate: produces
    object: Artifact
  - subject: WorkflowStep
    predicate: guarded_by
    object: Gate
  - subject: R2RContract
    predicate: producer
    object: Repository
  - subject: R2RContract
    predicate: consumer
    object: Repository
  - subject: R2RContract
    predicate: exchanges
    object: Artifact
  - subject: Artifact
    predicate: has_provenance
    object: Provenance
  - subject: AWPlan
    predicate: realizes
    object: Intent
  - subject: AWPlan
    predicate: decomposes_into
    object: Workflow
  - subject: AWPlan
    predicate: defines
    object: Gate
  - subject: Analysis
    predicate: uses
    object: Observation
  - subject: EditorialText
    predicate: cites
    object: Observation
  - subject: AudioEpisode
    predicate: derived_from
    object: EditorialText
  - subject: Project
    predicate: owns
    object: TypeTransformation
  - subject: Project
    predicate: accepts
    object: DataType
  - subject: Project
    predicate: emits
    object: DataType
  - subject: TypeTransformation
    predicate: transforms
    object: DataType
  - subject: TypeTransformation
    predicate: validated_by
    object: Gate
  - subject: Agent
    predicate: performs
    object: TypeTransformation
  - subject: Agent
    predicate: uses_skill
    object: Skill
  - subject: Task
    predicate: invokes
    object: Tool
  - subject: Task
    predicate: requires_skill
    object: Skill
  - subject: Plan
    predicate: decomposes_into
    object: Task

boundary_rules:
  - id: topology-is-not-workflow
    rule: topology may say an edge is possible; workflow says when and under what state it runs
  - id: r2r-is-not-topology
    rule: r2r defines a durable artifact contract across repos; topology defines the broader graph of possible connections
  - id: aw-is-not-execution
    rule: aw captures intent, acceptance, and decomposition; workflow performs the approved plan
  - id: workflow-must-honor-r2r
    rule: a workflow step crossing repositories must reference an R2R contract
  - id: public-podcast-gate
    rule: audio generation requires approved editorial text, citations, provenance, and uncertainty disclosure
  - id: private-boundary
    rule: private source content may inform authorized analysis but must not be copied into the public target repository
  - id: project-is-type-owner
    rule: every project declares input types, output types, and the transformations it owns
  - id: transformation-is-work
    rule: a type edge is not complete until its normalization, analysis, writing, or generation work is named
  - id: typed-r2r
    rule: every R2R artifact must reference a versioned DataType and a producing TypeTransformation
  - id: research-before-production
    rule: producer planning consumes a marketing research packet and must not invent market evidence
  - id: producer-is-not-marketer
    rule: marketing agent researches signals; producer agent chooses concept, plan, and execution decomposition
  - id: task-is-skill-and-tool-bound
    rule: every producer task declares at least one skill, one tool, an owner, inputs, outputs, and done condition
  - id: architype-is-not-project
    rule: an architype defines reusable producer semantics; a practical type applies them to a domain; a project owns concrete outputs

instances:
  topology:
    id: idol-ecosystem-topology
    nodes:
      - idol-db
      - idol-research
      - idol-podcast
      - podcast-generator
      - human-editor
      - public-data-sources
      - idol-marketing-agent
      - idol-producer-agent
    edges:
      - [public-data-sources, idol-db]
      - [idol-db, idol-research]
      - [idol-db, idol-podcast]
      - [idol-research, idol-podcast]
      - [idol-research, idol-marketing-agent]
      - [idol-marketing-agent, idol-producer-agent]
      - [idol-producer-agent, idol-podcast]
      - [idol-podcast, human-editor]
      - [idol-podcast, podcast-generator]

  r2r:
    id: idol-critique-podcast-r2r
    contract_file: r2r.yaml
    exchanges:
      - selected_evidence.json
      - analysis_packet.json
      - episode-script.md
      - citations.json
      - episode.mp3

  workflow:
    id: idol-critique-podcast
    workflow_file: config/pipeline.yml
    steps:
      - select-evidence
      - attach-analysis
      - write-critique
      - human-editorial-review
      - generate-audio

  aw:
    id: idol-podcast-aw
    intent: "既存のidolデータと研究を、検証可能な公共の批評へ変換する"
    outcomes:
      - evidence-backed-episode
      - traceable-citations
      - explicit-counter-hypothesis
      - reviewable-audio
    acceptance_criteria:
      - every_material_fact_has_source
      - fact_inference_hypothesis_are_separate
      - human_review_precedes_audio
      - private_content_is_not_published

  project_data:
    id: idol-critique-podcast-project-data
    project_file: project.yaml
    projects:
      - idol-db
      - idol-research
      - idol-podcast
      - podcast-generator
    transformations:
      - public-record-to-canonical-record
      - canonical-data-to-observations
      - observations-to-analysis
      - analysis-to-evidence-selection
      - analysis-to-critique-brief
      - critique-brief-to-script
      - script-to-citation-manifest
      - approved-script-to-audio

  producer_layers:
    architype:
      id: producer-agent
      repository: bonsai/producer-agent
    practical_type:
      id: idol-p-agent
      repository: bonsai/idol-p-agent
      conforms_to: producer-agent
    project:
      id: idol-podcast
      repository: bonsai/idol-podcast
      planned_by: idol-p-agent
